workflows:
  ios-unsigned:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Xcode version
        script: xcodebuild -version
      - name: Install XcodeGen
        script: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build (unsigned)
        script: |
          xcodebuild \
            -project ReplyFromPreview.xcodeproj \
            -scheme ReplyFromPreview \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ReplyFromPreview.app Payload/
          zip -qr ReplyFromPreview.ipa Payload
    artifacts:
      - ReplyFromPreview.ipa
