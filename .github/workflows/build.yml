name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Две очереди сразу: Apple Silicon и Intel. Какая освободится раньше, та и соберёт.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Liquid Glass SDK)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "Xcode 26 not found"; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ReplyFromPreview.xcodeproj \
            -scheme ReplyFromPreview \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ReplyFromPreview.app Payload/
          zip -qr ReplyFromPreview.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ReplyFromPreview-ipa-${{ matrix.runner }}
          path: ReplyFromPreview.ipa
